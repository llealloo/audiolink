name: Check Version

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package.json"
      - "**/VERSION.txt"
      - "CHANGELOG.md"
      - "**/AudioLink.cs"
      - "**/AudioLinkAssetManager.cs"
      - "Tools/check-version.sh"
      - ".github/workflows/version.yaml"
  push:
    branches:
      - master
    paths:
      - "**/package.json"
      - "**/VERSION.txt"
      - "CHANGELOG.md"
      - "**/AudioLink.cs"
      - "**/AudioLinkAssetManager.cs"
      - "Tools/check-version.sh"
      - ".github/workflows/version.yaml"

jobs:
  version:
    name: version numbers agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version consistency
        run: sh Tools/check-version.sh
